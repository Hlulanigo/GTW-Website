<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The GTW - Dashboard</title>
    <style>
        :root {
            --primary: #0A7EA4;
            --primary-dark: #075a75;
            --secondary: #F97316;
            --bg-gradient: linear-gradient(135deg, #0A7EA4 0%, #1e3a8a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }
        
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
            padding: 48px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo-container {
            margin-bottom: 24px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 40px;
            font-weight: 400;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .status-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e5e7eb;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }
        
        .status-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }
        
        .status-card.online {
            border-left: 4px solid var(--success);
        }
        
        .status-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .status-value {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
            display: flex;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            background: var(--error);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }
        
        .status-indicator.online {
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 40px;
        }
        
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            gap: 10px;
        }
        
        .link-btn.primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(10, 126, 164, 0.2);
        }

        .link-btn.primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(10, 126, 164, 0.3);
        }
        
        .link-btn.secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .link-btn.secondary:hover {
            background: #f0f9ff;
            transform: translateY(-2px);
        }
        
        .info-section {
            margin-top: 48px;
            text-align: left;
            background: rgba(243, 244, 246, 0.5);
            padding: 32px;
            border-radius: 16px;
        }
        
        .info-section h3 {
            color: var(--text-main);
            margin-bottom: 20px;
            font-size: 1.125rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.875rem;
            color: var(--text-main);
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        
        .loading-pulse {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <span class="logo-icon">📦</span>
            <h1>The GTW</h1>
            <p class="subtitle">Go The Way — Liquid Delivery Management</p>
        </div>
        
        <div class="status-grid">
            <div class="status-card online">
                <div class="status-label">
                    <span>API Server</span>
                    <span class="status-indicator online"></span>
                </div>
                <div class="status-value">Active</div>
            </div>
            <div class="status-card" id="dbStatus">
                <div class="status-label">
                    <span>Database</span>
                    <div class="loading-pulse"></div>
                </div>
                <div class="status-value">Connecting...</div>
            </div>
        </div>
        
        <div class="links">
            <a href="https://play.google.com" class="link-btn primary" target="_blank">
                <span>📱</span> Get Android App
            </a>
            <a href="/api/health" class="link-btn secondary">
                <span>🔧</span> Health Diagnostics
            </a>
        </div>
        
        <div class="info-section">
            <h3><span>ℹ️</span> System Configuration</h3>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Environment</span>
                    <span class="info-value">Production</span>
                </div>
                <div class="info-item">
                    <span class="info-label">API Gateway</span>
                    <span class="info-value">/api/v1</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Real-time</span>
                    <span class="info-value">Firebase Enabled</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Version</span>
                    <span class="info-value">1.0.4-stable</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function checkDatabase() {
            try {
                const start = Date.now();
                const response = await fetch('/api/health');
                const duration = Date.now() - start;
                
                if (response.ok) {
                    const dbStatus = document.getElementById('dbStatus');
                    dbStatus.classList.add('online');
                    dbStatus.innerHTML = `
                        <div class="status-label">
                            <span>Database</span>
                            <span class="status-indicator online"></span>
                        </div>
                        <div class="status-value">Connected</div>
                        <div style="font-size: 0.7rem; color: #10b981; margin-top: 4px; font-weight: 500;">
                            Latency: ${duration}ms
                        </div>
                    `;
                } else {
                    throw new Error('Health check failed');
                }
            } catch (error) {
                const dbStatus = document.getElementById('dbStatus');
                dbStatus.innerHTML = `
                    <div class="status-label">
                        <span>Database</span>
                        <span class="status-indicator"></span>
                    </div>
                    <div class="status-value" style="color: #ef4444">Offline</div>
                `;
            }
        }
        
        checkDatabase();
        setInterval(checkDatabase, 15000);
    </script>
</body>
</html>
